<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>race</title>
<style>:root {
  --fg: #1f2328; --muted: #59636e; --grid: #eceef1; --axis: #8c959f;
  --bg: #ffffff; --chip: #f3f4f6; --chip-on: #ffffff; --border: #d0d7de; --accent: #d9480f;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
#app { position: relative; padding: 6px 4px 4px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin: 0 0 6px; }
.row .lbl { color: var(--muted); font-size: 12px; margin-right: -6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: inherit; font-size: 12px; border: 1px solid var(--border); background: var(--chip); color: var(--muted);
  border-radius: 999px; padding: 2px 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; line-height: 18px; }
.chip:hover { border-color: var(--axis); }
.chip.on { background: var(--chip-on); color: var(--fg); border-color: var(--fg); box-shadow: 0 0 0 0.5px var(--fg) inset; }
.chip .sw { width: 14px; height: 0; border-top: 2.5px solid var(--c); display: inline-block; opacity: .35; }
.chip.on .sw { opacity: 1; }
.chip .sw.dashed { border-top-style: dashed; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 12px; border: 0; background: var(--chip); color: var(--muted); padding: 3px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--fg); color: #fff; }
svg { display: block; overflow: visible; }
svg text { fill: var(--fg); font-size: 11px; }
.grid line { stroke: var(--grid); stroke-width: 1; }
.axis line { stroke: var(--axis); stroke-width: 1; }
.axis text { fill: var(--muted); }
.axis text.label { fill: var(--fg); font-size: 12px; }
.tip { position: absolute; display: none; pointer-events: none; background: rgba(255,255,255,.97); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 5; white-space: nowrap; }
.tip table { border-collapse: collapse; }
.tip td { padding: 0 4px; }
.tip td.n { text-align: right; font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 10px; height: 3px; vertical-align: middle; }
.note { color: var(--muted); font-size: 12px; margin-top: 4px; }
.stat { font-variant-numeric: tabular-nums; }
.legend-inline { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend-inline span.k { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }

.lane { display: grid; grid-template-columns: 128px 1fr 150px; align-items: center; gap: 8px; margin: 3px 0; }
.lane .nm { font-size: 12px; text-align: right; white-space: nowrap; }
.lane .nm small { display: block; color: var(--muted); font-size: 10.5px; }
.track { position: relative; height: 18px; background: #f1f3f5; border-radius: 4px; overflow: hidden; }
.bar { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 4px; }
.lane .steps { font-size: 10.5px; color: #59636e; margin-left: 4px; }
.lane .ms { font-size: 12px; font-variant-numeric: tabular-nums; }
.btn { font: inherit; font-size: 12px; border: 1px solid var(--fg); background: var(--fg); color: #fff; border-radius: 6px; padding: 3px 12px; cursor: pointer; }
.grp { font-size: 11px; color: var(--muted); margin: 8px 0 2px 136px; text-transform: uppercase; letter-spacing: .04em; }
</style>

<script>/* Minimal dependency-free SVG plotting helpers shared by the interactive figures. */
const NF = (() => {
  const SVGNS = 'http://www.w3.org/2000/svg';
  const METHODS = {
    normflowsde:    { label: 'NormFlowSDE',    color: '#d9480f', route: 'direct' },
    latent_nsf:     { label: 'Latent NSF',     color: '#1c7ed6', route: 'direct' },
    latent_sde:     { label: 'Latent SDE',     color: '#2b8a3e', route: 'direct' },
    sigker_sde:     { label: 'SigKer SDE',     color: '#7048e8', route: 'direct' },
    nf_dpf:         { label: 'NF-DPF',         color: '#0b7285', route: 'pf' },
    nsf:            { label: 'NSF-PF',         color: '#c2255c', route: 'pf' },
    flowsde:        { label: 'FlowSDE-PF',     color: '#5c940d', route: 'pf' },
    normflowsde_pf: { label: 'NormFlowSDE-PF', color: '#f08c00', route: 'pf' },
  };

  function el(tag, attrs = {}, parent = null, text = null) {
    const e = document.createElementNS(SVGNS, tag);
    for (const k in attrs) if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
    if (text !== null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  function html(tag, attrs = {}, parent = null, text = null) {
    const e = document.createElement(tag);
    for (const k in attrs) {
      if (k === 'class') e.className = attrs[k];
      else if (k === 'style') e.style.cssText = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    if (text !== null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  function linear(d0, d1, r0, r1) {
    const f = v => r0 + (v - d0) / (d1 - d0) * (r1 - r0);
    f.inv = p => d0 + (p - r0) / (r1 - r0) * (d1 - d0);
    f.domain = [d0, d1]; f.range = [r0, r1]; f.isLog = false;
    return f;
  }

  function log(d0, d1, r0, r1) {
    const l0 = Math.log10(d0), l1 = Math.log10(d1);
    const f = v => r0 + (Math.log10(Math.max(v, 1e-300)) - l0) / (l1 - l0) * (r1 - r0);
    f.inv = p => Math.pow(10, l0 + (p - r0) / (r1 - r0) * (l1 - l0));
    f.domain = [d0, d1]; f.range = [r0, r1]; f.isLog = true;
    return f;
  }

  function niceStep(span, n) {
    const raw = span / Math.max(n, 1);
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
  }

  function ticks(a, b, n = 5) {
    const s = niceStep(b - a, n), out = [];
    for (let v = Math.ceil(a / s - 1e-9) * s; v <= b + s * 1e-9; v += s) out.push(Math.abs(v) < s * 1e-9 ? 0 : v);
    return out;
  }

  function logTicks(a, b) {
    const out = [];
    const span = Math.log10(b) - Math.log10(a);
    const mults = span > 2.5 ? [1] : span > 1.2 ? [1, 2, 5] : [1, 2, 3, 5, 7];
    for (let e = Math.floor(Math.log10(a)); e <= Math.ceil(Math.log10(b)); e++)
      for (const m of mults) { const v = m * Math.pow(10, e); if (v >= a * 0.999 && v <= b * 1.001) out.push(v); }
    return out;
  }

  function fmt(v, digits = 3) {
    if (v === null || v === undefined || !isFinite(v)) return '–';
    const a = Math.abs(v);
    if (a !== 0 && (a < 1e-3 || a >= 1e5)) return v.toExponential(1);
    return Number(v.toPrecision(digits)).toString();
  }

  function tickFmt(v) {
    const a = Math.abs(v);
    if (a !== 0 && a < 1e-3) return v.toExponential(0);
    return Number(v.toPrecision(3)).toString();
  }

  function axes(g, x, y, o = {}) {
    const [x0, x1] = x.range, [y0, y1] = y.range;
    const xt = o.xticks || (x.isLog ? logTicks(...x.domain) : ticks(...x.domain, o.nx || 6));
    const yt = o.yticks || (y.isLog ? logTicks(...y.domain) : ticks(...y.domain, o.ny || 5));
    const grid = el('g', { class: 'grid' }, g);
    for (const v of yt) el('line', { x1: x0, x2: x1, y1: y(v), y2: y(v) }, grid);
    for (const v of xt) el('line', { x1: x(v), x2: x(v), y1: y0, y2: y1 }, grid);
    const ax = el('g', { class: 'axis' }, g);
    el('line', { x1: x0, x2: x1, y1: y0, y2: y0 }, ax);
    el('line', { x1: x0, x2: x0, y1: y0, y2: y1 }, ax);
    const xf = o.xfmt || tickFmt, yf = o.yfmt || tickFmt;
    for (const v of xt) el('text', { x: x(v), y: y0 + 15, 'text-anchor': 'middle' }, ax, xf(v));
    for (const v of yt) el('text', { x: x0 - 6, y: y(v) + 4, 'text-anchor': 'end' }, ax, yf(v));
    if (o.xlabel) el('text', { x: (x0 + x1) / 2, y: y0 + 33, 'text-anchor': 'middle', class: 'label' }, ax, o.xlabel);
    if (o.ylabel) el('text', { x: 0, y: 0, 'text-anchor': 'middle', class: 'label',
      transform: `translate(${x0 - (o.ylabelOffset || 44)},${(y0 + y1) / 2}) rotate(-90)` }, ax, o.ylabel);
  }

  function path(xs, ys, x, y) {
    let d = '';
    for (let i = 0; i < xs.length; i++) {
      if (ys[i] === null || !isFinite(ys[i])) continue;
      d += (d ? 'L' : 'M') + x(xs[i]).toFixed(1) + ',' + y(ys[i]).toFixed(1);
    }
    return d;
  }

  function area(xs, lo, hi, x, y) {
    let d = '';
    for (let i = 0; i < xs.length; i++) d += (i ? 'L' : 'M') + x(xs[i]).toFixed(1) + ',' + y(hi[i]).toFixed(1);
    for (let i = xs.length - 1; i >= 0; i--) d += 'L' + x(xs[i]).toFixed(1) + ',' + y(lo[i]).toFixed(1);
    return d + 'Z';
  }

  function tooltip(container) {
    const t = html('div', { class: 'tip' }, container);
    return {
      show(px, py, content) {
        t.innerHTML = content; t.style.display = 'block';
        const cw = container.clientWidth, tw = t.offsetWidth;
        t.style.left = Math.min(Math.max(px + 14, 4), cw - tw - 4) + 'px';
        t.style.top = Math.max(py - 10, 0) + 'px';
      },
      hide() { t.style.display = 'none'; },
    };
  }

  function chips(parent, items, opts = {}) {
    /* items: [{key, label, color?, dashed?, title?}]; returns {set(keys)} */
    const box = html('div', { class: 'chips' + (opts.cls ? ' ' + opts.cls : '') }, parent);
    const btns = {};
    for (const it of items) {
      const b = html('button', { class: 'chip', type: 'button', title: it.title || '' }, box);
      if (it.color) {
        const sw = html('span', { class: 'sw' + (it.dashed ? ' dashed' : '') }, b);
        sw.style.setProperty('--c', it.color);
      }
      html('span', {}, b, it.label);
      b.addEventListener('click', () => opts.onClick && opts.onClick(it.key));
      btns[it.key] = b;
    }
    return {
      set(active) { for (const k in btns) btns[k].classList.toggle('on', active.has ? active.has(k) : active === k); },
      buttons: btns,
    };
  }

  function onResize(fn) {
    let w = 0;
    const run = () => { const nw = document.body.clientWidth; if (nw !== w) { w = nw; fn(); } reportHeight(); };
    window.addEventListener('resize', run);
    run();
  }

  function reportHeight() {
    try {
      const app = document.getElementById('app');
      const h = Math.ceil(app ? app.getBoundingClientRect().height + 6 : document.body.scrollHeight);
      window.parent.postMessage({ nfFrame: window.name || document.title, height: h }, '*');
    } catch (e) { /* ignore */ }
  }

  return { METHODS, el, html, linear, log, ticks, logTicks, fmt, axes, path, area, tooltip, chips, onResize, reportHeight };
})();
</script>

<script>
(() => {
  const app = document.getElementById('app');
  const st = { ds: DATA.datasets[3].key };
  const r1 = NF.html('div', { class: 'row' }, app);
  NF.html('span', { class: 'lbl' }, r1, 'Dataset');
  const seg = NF.html('div', { class: 'seg' }, r1); const sb = {};
  for (const d of DATA.datasets) { const b = NF.html('button', { type: 'button' }, seg, d.label); b.onclick = () => { st.ds = d.key; build(); run(); }; sb[d.key] = b; }
  const go = NF.html('button', { class: 'btn', type: 'button' }, r1, '▶ Filter one test window');
  go.onclick = () => run();
  const lanes = NF.html('div', {}, app);
  const note = NF.html('div', { class: 'note' }, app);
  let L = [], raf = null;

  function build() {
    for (const k in sb) sb[k].classList.toggle('on', k === st.ds);
    const d = DATA.datasets.find(x => x.key === st.ds);
    lanes.innerHTML = ''; L = [];
    for (const [route, title] of [['direct', 'Direct estimators: one network pass per step'], ['pf', `Particle filters: ${d.M} particles per step, transition + likelihood + resampling`]]) {
      NF.html('div', { class: 'grp' }, lanes, title);
      for (const r of d.rows.filter(x => x.route === route)) {
        const lane = NF.html('div', { class: 'lane' }, lanes);
        const nm = NF.html('div', { class: 'nm' }, lane);
        nm.innerHTML = r.key === 'normflowsde' ? `<b>${r.label}</b>` : r.label;
        const tr = NF.html('div', { class: 'track' }, lane);
        const bar = NF.html('div', { class: 'bar' }, tr);
        bar.style.background = NF.METHODS[r.key].color;
        const msbox = NF.html('div', { class: 'ms' }, lane);
        const ms = NF.html('span', {}, msbox, '');
        const steps = NF.html('span', { class: 'steps' }, msbox);
        L.push({ r, bar, steps, ms });
        // finished state by default (also what a printout shows)
        const slowest = Math.max(...d.rows.filter(x => x.route !== 'ref').map(x => x.latency));
        bar.style.width = (r.latency / slowest * 100).toFixed(1) + '%';
        ms.textContent = `${r.latency.toFixed(1)} ms`;
      }
    }
    const dir = d.rows.find(x => x.key === 'normflowsde').latency;
    const fastPF = Math.min(...d.rows.filter(x => x.route === 'pf').map(x => x.latency));
    note.innerHTML = `Each bar grows with elapsed time and stops when the method has filtered the window; its final length is the measured median latency per test window (Tables ${DATA.tables}, one NVIDIA L40S, slowed down for display). ` +
      `A window has ${d.steps} steps. On ${d.label}, NormFlowSDE finishes in ${dir.toFixed(1)} ms, <b>${(fastPF / dir).toFixed(1)}×</b> faster than the fastest particle filter (${fastPF.toFixed(1)} ms).`;
    NF.reportHeight();
  }

  function run() {
    if (raf) cancelAnimationFrame(raf);
    const d = DATA.datasets.find(x => x.key === st.ds);
    const slowest = Math.max(...d.rows.filter(x => x.route !== 'ref').map(x => x.latency));
    const scale = 5000 / slowest; // display ms per measured ms
    const t0 = performance.now();
    const tick = now => {
      const el = (now - t0) / scale; // measured ms elapsed
      let done = true;
      for (const l of L) {
        const f = Math.min(el / l.r.latency, 1);
        if (f < 1) done = false;
        l.bar.style.width = (Math.min(el, l.r.latency) / slowest * 100).toFixed(2) + '%';
        l.steps.textContent = `step ${Math.floor(f * d.steps)}/${d.steps}`;
        l.ms.textContent = f >= 1 ? `${l.r.latency.toFixed(1)} ms ✓` : `${el.toFixed(1)} ms`;
      }
      if (!done) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  build();
  NF.onResize(() => NF.reportHeight());
  // start once the figure is scrolled into view
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { run(); io.disconnect(); } });
  io.observe(app);
})();
</script>
</body>
